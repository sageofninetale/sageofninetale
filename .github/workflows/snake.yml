name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: sageofninetale
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FB7185&color_dots=%230B1220,%23134E4A,%230F766E,%2314B8A6,%235EEAD4
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FB7185&color_dots=%230B1220,%23134E4A,%230F766E,%2314B8A6,%235EEAD4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
